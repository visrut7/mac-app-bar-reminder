name: CI

# Catches compile breakage before it ever reaches a release tag.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: swift build
        run: swift build -c release
      - name: Assemble .app (sanity check)
        run: ./Scripts/build-app.sh
